services:
  lci-postgres:
    image: postgres:17-alpine
    container_name: lola-lci-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lola
      POSTGRES_PASSWORD: lola
      POSTGRES_DB: lola
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - lci_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lola -d lola"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  lci_pg_data:
